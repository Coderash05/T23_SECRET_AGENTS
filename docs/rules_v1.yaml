version: "1.2.0"

severity_weights:
  critical: 40.0
  high: 25.0
  medium: 10.0
  low: 5.0
  info: 0.0

rules:
  - id: "R-LP-01"
    family: "liquidation_preference"
    condition: "multiple > 1"
    severity: "HIGH"
    message: "Liquidation payout multiple exceeds standard 1x."
    source: "NVCA Model Term Sheet §3 (Liquidation Preference)"
    norm_id: "1x_Non_Participating"
    conclusion: "HighLiquidationMultiple"

  - id: "R-CT-02"
    family: "board_of_directors"
    condition: "investor_seats > founder_seats"
    severity: "HIGH"
    message: "Investors control the majority of the board."
    source: "NVCA Model Term Sheet §2 (Board of Directors)"
    norm_id: "Balanced_Or_Founder_Control_Board"
    conclusion: "InvestorControl"

  - id: "R-LP-02"
    family: "liquidation_preference"
    condition: "participation == true"
    severity: "HIGH"
    message: "Participating preferred stock allows investors to double-dip on returns."
    source: "NVCA Enhanced Model Term Sheet §3"
    norm_id: "1x_Non_Participating"
    conclusion: "ParticipatingPreferred"

  - id: "R-VS-01"
    family: "vesting"
    condition: "vesting_months < 48"
    severity: "MEDIUM"
    message: "Vesting schedule is shorter than the standard 4-year (48 months) period."
    source: "Market Norm / YC SAFE"
    norm_id: "Standard_4_Year_1_Year_Cliff_Vesting"
    conclusion: "NonStandardVestingDuration"

  - id: "R-VS-02"
    family: "vesting"
    condition: "cliff_months > 12"
    severity: "HIGH"
    message: "Cliff period exceeds the standard 1-year (12 months) norm."
    source: "NVCA Model Term Sheet §5 / Market Norm"
    norm_id: "Standard_4_Year_1_Year_Cliff_Vesting"
    conclusion: "LongVestingCliff"

  - id: "R-AD-01"
    family: "anti_dilution"
    condition: "type == 'full_ratchet'"
    severity: "CRITICAL"
    message: "Full-Ratchet anti-dilution is highly punitive to founders in a down round."
    source: "NVCA Model Term Sheet §4 (Anti-Dilution Provisions)"
    norm_id: "Broad_Based_Weighted_Average"
    conclusion: "SevereDilutionRisk"

  - id: "R-AD-02"
    family: "anti_dilution"
    condition: "type == 'broad_based_weighted_average'"
    severity: "LOW"
    message: "Broad-based weighted average is standard and founder-friendly."
    source: "NVCA Model Term Sheet §4 (Anti-Dilution Provisions)"
    norm_id: "Broad_Based_Weighted_Average"
    conclusion: "StandardBroadBasedAntiDilution"

  - id: "R-PP-01"
    family: "protective_provisions"
    condition: "veto_day_to_day_operations == true"
    severity: "HIGH"
    message: "Investors hold veto power over standard day-to-day operational decisions."
    source: "NVCA Model Term Sheet §3 (Protective Provisions)"
    norm_id: "Standard_Major_Action_Protective_Provisions"
    conclusion: "OperationalVetoOverreach"

  - id: "R-DA-01"
    family: "drag_along"
    condition: "approval_threshold < 50"
    severity: "HIGH"
    message: "Drag-along can be triggered by less than a majority of shareholders."
    source: "NVCA Model Term Sheet §4 (Drag-Along)"
    norm_id: "Supermajority_And_Board_Drag_Along"
    conclusion: "MinorityDragAlongTrigger"

  - id: "R-OP-01"
    family: "option_pool"
    condition: "pool_percentage > 20"
    severity: "MEDIUM"
    message: "Post-money option pool exceeds the typical 10-20% range, causing excess founder dilution."
    source: "NVCA Enhanced Model Term Sheet / Market Norm"
    norm_id: "Standard_10_To_20_Pct_Option_Pool"
    conclusion: "ExcessiveOptionPool"

  - id: "R-RD-01"
    family: "redemption"
    condition: "redemption_years < 5"
    severity: "HIGH"
    message: "Redemption rights are exercisable in less than 5 years, creating early liquidity pressure."
    source: "NVCA Model Term Sheet §4 (Redemption Rights)"
    norm_id: "No_Early_Mandatory_Redemption"
    conclusion: "EarlyRedemptionHorizon"

  - id: "R-EX-01"
    family: "exclusivity"
    condition: "duration_days > 45"
    severity: "MEDIUM"
    message: "No-shop/exclusivity period exceeds standard 30-45 days."
    source: "NVCA Model Term Sheet §6 (No-Shop)"
    norm_id: "30_To_45_Day_No_Shop"
    conclusion: "LongExclusivity"

  - id: "R-DV-01"
    family: "dividends"
    condition: "cumulative == true"
    severity: "HIGH"
    message: "Cumulative dividends guarantee a fixed return that accrues as a debt-like liability."
    source: "NVCA Model Term Sheet §3 (Dividends)"
    norm_id: "No_Cumulative_Dividends"
    conclusion: "CumulativeDividendLiability"

  - id: "R-CT-03"
    family: "board_of_directors"
    condition: "independent_seats == 0"
    severity: "MEDIUM"
    message: "No independent board seats allocated, potentially leading to deadlock."
    source: "Market Practice Studies (Kaplan & Strömberg)"
    norm_id: "Balanced_Or_Founder_Control_Board"
    conclusion: "NoIndependentBoardSeats"

  - id: "R-LP-03"
    family: "liquidation_preference"
    condition: "seniority == 'senior'"
    severity: "MEDIUM"
    message: "New investors have senior liquidation preference over existing preferred stockholders."
    source: "NVCA Model Term Sheet §3 (Liquidation Preference)"
    norm_id: "1x_Non_Participating"
    conclusion: "SeniorLiquidationPreference"

  - id: "R-LP-04"
    family: "liquidation_preference"
    condition: "multiple >= 3"
    severity: "CRITICAL"
    message: "Severe 3x or greater liquidation multiple poses extreme economic risk to founders."
    source: "Empirical VC Contract Studies (Kaplan & Strömberg)"
    norm_id: "1x_Non_Participating"
    conclusion: "ExtremeLiquidationMultiple"

  - id: "R-LP-05"
    family: "liquidation_preference"
    condition: "participation == true and cap == null"
    severity: "CRITICAL"
    message: "Uncapped participating preferred stock permits unlimited investor double-dipping."
    source: "NVCA Enhanced Model Term Sheet §3"
    norm_id: "1x_Non_Participating"
    conclusion: "UncappedParticipation"

  - id: "R-AD-03"
    family: "anti_dilution"
    condition: "type == 'narrow_based_weighted_average'"
    severity: "MEDIUM"
    message: "Narrow-based weighted average formula excludes options/convertibles, causing higher dilution than broad-based."
    source: "NVCA Model Term Sheet §4 (Anti-Dilution Provisions)"
    norm_id: "Broad_Based_Weighted_Average"
    conclusion: "NarrowBasedAntiDilution"

  - id: "R-CT-04"
    family: "board_of_directors"
    condition: "founder_seats <= 1 and total_seats >= 5"
    severity: "HIGH"
    message: "Founders hold single minority seat on large board, relinquishing strategic control."
    source: "Market Norm / NVCA Model Term Sheet §2"
    norm_id: "Balanced_Or_Founder_Control_Board"
    conclusion: "FounderMinorityOnLargeBoard"

  - id: "R-CT-05"
    family: "vesting"
    condition: "InvestorControl == true and VestingReset == true"
    severity: "HIGH"
    message: "Founder removable with loss of equity: investor board control combined with vesting reset allows the board to terminate a founder and repurchase unvested shares."
    source: "NVCA Model Term Sheet §2 & §5 / Kaplan & Strömberg (2003)"
    norm_id: "Standard_4_Year_1_Year_Cliff_Vesting"
    conclusion: "FounderRemovableWithEquityLoss"

  - id: "R-VS-03"
    family: "vesting"
    condition: "acceleration == 'none'"
    severity: "MEDIUM"
    message: "Lack of double-trigger vesting acceleration leaves founder equity unprotected in an acquisition."
    source: "YC SAFE / NVCA Model Term Sheet §5"
    norm_id: "Standard_4_Year_1_Year_Cliff_Vesting"
    conclusion: "NoVestingAcceleration"

  - id: "R-VS-04"
    family: "vesting"
    condition: "acceleration == 'double_trigger'"
    severity: "LOW"
    message: "Double-trigger acceleration is standard market practice protecting founders upon involuntary termination."
    source: "NVCA Model Term Sheet §5 (Vesting)"
    norm_id: "Standard_4_Year_1_Year_Cliff_Vesting"
    conclusion: "StandardDoubleTriggerAcceleration"

  - id: "R-PP-02"
    family: "protective_provisions"
    condition: "requires_series_majority == true"
    severity: "INFO"
    message: "Standard protective provision requiring preferred majority consent for major corporate changes."
    source: "NVCA Model Term Sheet §3 (Protective Provisions)"
    norm_id: "Standard_Major_Action_Protective_Provisions"
    conclusion: "StandardProtectiveProvisions"

  - id: "R-DA-02"
    family: "drag_along"
    condition: "requires_founder_consent == false and approval_threshold < 60"
    severity: "HIGH"
    message: "Drag-along covenants can force founders into a deemed sale without founder consent or high supermajority."
    source: "NVCA Model Term Sheet §4 (Drag-Along)"
    norm_id: "Supermajority_And_Board_Drag_Along"
    conclusion: "ForcedSaleWithoutFounderConsent"

  - id: "R-OP-02"
    family: "option_pool"
    condition: "pre_money_pool == true and pool_percentage > 15"
    severity: "HIGH"
    message: "Large pre-money option pool forces 100% of employee dilution onto existing founders prior to investment."
    source: "NVCA Enhanced Model Term Sheet / Market Norm"
    norm_id: "Standard_10_To_20_Pct_Option_Pool"
    conclusion: "DilutivePreMoneyOptionPool"

  - id: "R-RO-01"
    family: "rofr_co_sale"
    condition: "investor_co_sale == true"
    severity: "INFO"
    message: "Standard investor co-sale (tag-along) right applies on secondary sales by founders."
    source: "NVCA Model Term Sheet §4 (Right of First Refusal / Co-Sale)"
    norm_id: "Standard_Company_Then_Investor_ROFR"
    conclusion: "StandardCoSaleRights"

  - id: "R-RO-02"
    family: "rofr_co_sale"
    condition: "full_founder_transfer_lockup == true"
    severity: "MEDIUM"
    message: "Founder shares are subject to an outright transfer lockup beyond standard ROFR and co-sale mechanics."
    source: "NVCA Model Term Sheet §4 (Right of First Refusal / Co-Sale)"
    norm_id: "Standard_Company_Then_Investor_ROFR"
    conclusion: "RestrictiveFounderTransferLockup"

  - id: "R-IR-01"
    family: "information_rights"
    condition: "has_major_investor_threshold == false"
    severity: "MEDIUM"
    message: "Information and inspection rights are granted to all investors without a Major Investor threshold, increasing administrative burden and leakage risk."
    source: "NVCA Model Term Sheet §4 (Information and Observer Rights)"
    norm_id: "Major_Investor_Information_Rights"
    conclusion: "UnrestrictedInformationRights"

  - id: "R-IR-02"
    family: "information_rights"
    condition: "monthly_reporting_required == true"
    severity: "LOW"
    message: "Monthly financial reporting requirement imposes higher early-stage compliance overhead than standard quarterly and annual statements."
    source: "NVCA Model Term Sheet §4 (Information and Observer Rights)"
    norm_id: "Major_Investor_Information_Rights"
    conclusion: "FrequentReportingBurden"

  - id: "R-CV-01"
    family: "conversion_rights"
    condition: "automatic_conversion_ipo_threshold > 100"
    severity: "MEDIUM"
    message: "Automatic conversion Qualified IPO proceeds threshold exceeds $100M, allowing preferred holders to block IPO conversion."
    source: "NVCA Model Term Sheet §4 (Automatic Conversion)"
    norm_id: "Standard_1_To_1_Conversion_Rights"
    conclusion: "HighQualifiedIPOThreshold"

  - id: "R-RD-02"
    family: "redemption"
    condition: "interest_rate > 10"
    severity: "HIGH"
    message: "Mandatory redemption carries a punitive interest rate above 10% per annum on unredeemed shares."
    source: "NVCA Model Term Sheet §4 (Redemption Rights)"
    norm_id: "No_Early_Mandatory_Redemption"
    conclusion: "PunitiveRedemptionInterest"
