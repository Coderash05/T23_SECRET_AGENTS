rules:
  - id: "R-LP-01"
    family: "liquidation_preference"
    condition: "multiple > 1"
    severity: "HIGH"
    message: "Liquidation payout multiple exceeds standard 1x."
    source: "NVCA Model Term Sheet"

  - id: "R-CT-02"
    family: "board_of_directors"
    condition: "investor_seats > founder_seats"
    severity: "HIGH"
    message: "Investors control the majority of the board."
    source: "NVCA Model Term Sheet"

  - id: "R-LP-02"
    family: "liquidation_preference"
    condition: "participation == true"
    severity: "HIGH"
    message: "Participating preferred stock allows investors to double-dip on returns."
    source: "NVCA Enhanced Model Term Sheet"

  - id: "R-VS-01"
    family: "vesting"
    condition: "vesting_months < 48"
    severity: "MEDIUM"
    message: "Vesting schedule is shorter than the standard 4-year (48 months) period."
    source: "Market Norm / YC SAFE"

  - id: "R-VS-02"
    family: "vesting"
    condition: "cliff_months > 12"
    severity: "HIGH"
    message: "Cliff period exceeds the standard 1-year (12 months) norm."
    source: "Market Norm"

  - id: "R-AD-01"
    family: "anti_dilution"
    condition: "type == 'full_ratchet'"
    severity: "CRITICAL"
    message: "Full-Ratchet anti-dilution is highly punitive to founders in a down round."
    source: "NVCA Model Term Sheet"

  - id: "R-AD-02"
    family: "anti_dilution"
    condition: "type == 'broad_based_weighted_average'"
    severity: "LOW"
    message: "Broad-based weighted average is standard and founder-friendly."
    source: "NVCA Model Term Sheet"

  - id: "R-PP-01"
    family: "protective_provisions"
    condition: "veto_day_to_day_operations == true"
    severity: "HIGH"
    message: "Investors hold veto power over standard day-to-day operational decisions."
    source: "Market Norm"

  - id: "R-DA-01"
    family: "drag_along"
    condition: "approval_threshold < 50"
    severity: "HIGH"
    message: "Drag-along can be triggered by less than a majority of shareholders."
    source: "NVCA Model Term Sheet"

  - id: "R-OP-01"
    family: "option_pool"
    condition: "pool_percentage > 20"
    severity: "MEDIUM"
    message: "Post-money option pool exceeds the typical 10-20% range, causing excess founder dilution."
    source: "Market Norm"

  - id: "R-RD-01"
    family: "redemption"
    condition: "redemption_years < 5"
    severity: "HIGH"
    message: "Redemption rights are exercisable in less than 5 years, creating early liquidity pressure."
    source: "NVCA Model Term Sheet"

  - id: "R-EX-01"
    family: "exclusivity"
    condition: "duration_days > 45"
    severity: "MEDIUM"
    message: "No-shop/exclusivity period exceeds standard 30-45 days."
    source: "Market Norm"

  - id: "R-DV-01"
    family: "dividends"
    condition: "cumulative == true"
    severity: "HIGH"
    message: "Cumulative dividends guarantee a fixed return that accrues as a debt-like liability."
    source: "NVCA Model Term Sheet"

  - id: "R-CT-03"
    family: "board_of_directors"
    condition: "independent_seats == 0"
    severity: "MEDIUM"
    message: "No independent board seats allocated, potentially leading to deadlock."
    source: "Market Norm"

  - id: "R-LP-03"
    family: "liquidation_preference"
    condition: "seniority == 'senior'"
    severity: "MEDIUM"
    message: "New investors have senior liquidation preference over existing preferred stockholders."
    source: "NVCA Model Term Sheet"

  - id: "R-LP-04"
    family: "liquidation_preference"
    condition: "multiple >= 3"
    severity: "CRITICAL"
    message: "Severe 3x or greater liquidation multiple poses extreme economic risk to founders."
    source: "Empirical VC Contract Studies"

  - id: "R-LP-05"
    family: "liquidation_preference"
    condition: "participation == true and cap == null"
    severity: "CRITICAL"
    message: "Uncapped participating preferred stock permits unlimited investor double-dipping."
    source: "NVCA Enhanced Model Term Sheet"

  - id: "R-AD-03"
    family: "anti_dilution"
    condition: "type == 'narrow_based_weighted_average'"
    severity: "MEDIUM"
    message: "Narrow-based weighted average formula excludes options/convertibles, causing higher dilution than broad-based."
    source: "NVCA Model Term Sheet"

  - id: "R-CT-04"
    family: "board_of_directors"
    condition: "founder_seats <= 1 and total_seats >= 5"
    severity: "HIGH"
    message: "Founders hold single minority seat on large board, relinquishing strategic control."
    source: "Market Norm / NVCA"

  - id: "R-VS-03"
    family: "vesting"
    condition: "acceleration == 'none'"
    severity: "MEDIUM"
    message: "Lack of double-trigger vesting acceleration leaves founder equity unprotected in an acquisition."
    source: "YC SAFE / Market Norm"

  - id: "R-VS-04"
    family: "vesting"
    condition: "acceleration == 'double_trigger'"
    severity: "LOW"
    message: "Double-trigger acceleration is standard market practice protecting founders upon involuntary termination."
    source: "NVCA Model Term Sheet"

  - id: "R-PP-02"
    family: "protective_provisions"
    condition: "requires_series_majority == true"
    severity: "INFO"
    message: "Standard protective provision requiring preferred majority consent for major corporate changes."
    source: "NVCA Model Term Sheet"

  - id: "R-DA-02"
    family: "drag_along"
    condition: "requires_founder_consent == false and approval_threshold < 60"
    severity: "HIGH"
    message: "Drag-along covenants can force founders into a deemed sale without founder consent or high supermajority."
    source: "NVCA Model Term Sheet"

  - id: "R-OP-02"
    family: "option_pool"
    condition: "pre_money_pool == true and pool_percentage > 15"
    severity: "HIGH"
    message: "Large pre-money option pool forces 100% of employee dilution onto existing founders prior to investment."
    source: "Market Norm"

  - id: "R-RO-01"
    family: "rofr_co_sale"
    condition: "investor_co_sale == true"
    severity: "INFO"
    message: "Standard investor co-sale (tag-along) right applies on secondary sales by founders."
    source: "NVCA Model Term Sheet"
